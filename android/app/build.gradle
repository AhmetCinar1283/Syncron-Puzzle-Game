apply plugin: 'com.android.application'

/**
 * AdMob App ID'si koda GÖMÜLMEZ. Öncelik sırası:
 *   1. ADMOB_APP_ID ortam değişkeni (CI),
 *   2. android/local.properties içindeki `admobAppId` (gitignore'lu),
 *   3. `admobAppId` gradle özelliği (~/.gradle/gradle.properties veya -PadmobAppId=...),
 *   4. Google'ın test App ID'si (varsayılan — gerçek reklam GÖSTERMEZ).
 * Bkz. docs/platforms.md → "AdMob kimlik yönetimi".
 */
def admobTestAppId = 'ca-app-pub-3940256099942544~3347511713'
def resolvedAdmobAppId = System.getenv('ADMOB_APP_ID')
if (!resolvedAdmobAppId?.trim()) {
    def localProps = new Properties()
    def localPropsFile = rootProject.file('local.properties')
    if (localPropsFile.exists()) {
        localPropsFile.withInputStream { localProps.load(it) }
    }
    resolvedAdmobAppId = localProps.getProperty('admobAppId')
}
if (!resolvedAdmobAppId?.trim()) {
    resolvedAdmobAppId = project.findProperty('admobAppId')?.toString()
}
if (!resolvedAdmobAppId?.trim()) {
    resolvedAdmobAppId = admobTestAppId
    logger.warn("[admob] DIKKAT: Gercek AdMob App ID tanimli degil, Google TEST App ID kullaniliyor. Bu build GELIR URETMEZ. Bkz. docs/platforms.md")
}

/**
 * Release imzalama bilgisi koda GÖMÜLMEZ. android/keystore.properties (gitignore'lu) dosyasından
 * okunur. Aşağıdaki üç durumdan biri varsa release signingConfig atlanır ve
 * `assembleRelease`/`bundleRelease` imzasız kalır (debug build bundan etkilenmez); her durumda
 * nedeni söyleyen bir uyarı basılır:
 *   1. keystore.properties yok,
 *   2. `storeFile` boş ya da işaret ettiği .jks diskte yok (harici disk takılı değil vb.),
 *   3. storePassword / keyAlias / keyPassword alanlarından biri boş.
 * Kurulum: android/keystore.properties.example dosyasını android/keystore.properties olarak
 * kopyalayıp kendi değerlerinizi girin. Bkz. docs/release/anahtar-yonetimi.md
 */
/**
 * SÜRÜM TEK KAYNAKTAN TÜRETİLİR: repo kökündeki `package.json` -> "version".
 * Burada literal `versionCode` / `versionName` YAZILMAZ; elle artırmayı unutmak
 * Play'in yüklemeyi reddetmesine yol açıyordu.
 *
 *   versionName = package.json sürümü, olduğu gibi (ör. "0.3.0", "1.2.0-rc.1")
 *   versionCode = major * 1000000 + minor * 1000 + patch   (ör. 0.3.0 -> 3000)
 *
 * Bu formül semver artışıyla MONOTON artar: minor/patch 0..999 aralığında
 * sınırlandığı için bir üst bileşenin artışı her zaman daha büyük bir sayı üretir.
 * Üst sınır 2100999999 < Play'in 2100000000 sınırı olduğundan major 2099'a kadar
 * güvenlidir (aşağıda kontrol ediliyor). Ön-sürüm eki (-rc.1) versionCode'u
 * ETKİLEMEZ; aynı x.y.z için tek bir kod üretilir.
 *
 * Sürüm çıkarırken tek yapılacak: package.json içindeki "version" alanını artırmak.
 *
 * Hata durumunda build SESSİZCE düşük bir sürüme düşmez, GradleException atar —
 * yanlış versionCode ile imzalı AAB üretmek geri alınamaz bir hatadır.
 */
def packageJsonFile = rootProject.file('../package.json')
if (!packageJsonFile.exists()) {
    throw new GradleException("[version] package.json bulunamadi: " + packageJsonFile.absolutePath +
        " -- versionCode/versionName bu dosyadan turetiliyor.")
}
def rawAppVersion = new groovy.json.JsonSlurper().parse(packageJsonFile)?.version?.toString()?.trim()
def semverMatcher = (rawAppVersion ?: '') =~ /^(\d+)\.(\d+)\.(\d+)(?:[-+].*)?$/
if (!semverMatcher.matches()) {
    throw new GradleException("[version] package.json icindeki \"version\" alani semver degil: '" +
        rawAppVersion + "'. Beklenen bicim: MAJOR.MINOR.PATCH (ornek: 0.3.0).")
}
def versionMajor = semverMatcher[0][1] as int
def versionMinor = semverMatcher[0][2] as int
def versionPatch = semverMatcher[0][3] as int
if (versionMinor > 999 || versionPatch > 999) {
    throw new GradleException("[version] minor ve patch 999'u asamaz (versionCode monotonlugu bozulur): " + rawAppVersion)
}
if (versionMajor > 2099) {
    throw new GradleException("[version] major 2099'u asamaz (Play versionCode ust siniri 2100000000): " + rawAppVersion)
}
def appVersionName = rawAppVersion
def appVersionCode = versionMajor * 1000000 + versionMinor * 1000 + versionPatch
if (appVersionCode < 1) {
    throw new GradleException("[version] versionCode en az 1 olmali; package.json surumu '" + rawAppVersion +
        "' 0 uretiyor. Surumu en az 0.0.1 yapin.")
}
logger.lifecycle("[version] package.json -> versionName=" + appVersionName + ", versionCode=" + appVersionCode)

def keystorePropsFile = rootProject.file('keystore.properties')
def keystoreProps = new Properties()
def keystoreFile = null
def keystoreSkipReason = "android/keystore.properties yok (kurulum icin keystore.properties.example'a bakin)"
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
    def storeFilePath = keystoreProps['storeFile']?.toString()?.trim()
    def missingFields = ['storePassword', 'keyAlias', 'keyPassword'].findAll {
        !keystoreProps[it]?.toString()?.trim()
    }
    if (!storeFilePath) {
        keystoreSkipReason = "android/keystore.properties icinde 'storeFile' bos"
    } else {
        def candidate = rootProject.file(storeFilePath)
        if (!candidate.exists()) {
            keystoreSkipReason = "anahtar dosyasi BULUNAMADI." +
                " keystore.properties -> storeFile=" + storeFilePath +
                " ; aranan tam yol: " + candidate.absolutePath +
                " -- Harici disk takili mi? (Windows yollarinda ters bolu CIFT yazilir:" +
                " D:\\\\PROJECTS\\\\keys\\\\x.jks) Bkz. docs/release/anahtar-yonetimi.md"
        } else if (!missingFields.isEmpty()) {
            keystoreSkipReason = "android/keystore.properties icinde su alanlar bos: " +
                missingFields.join(', ')
        } else {
            keystoreFile = candidate
            keystoreSkipReason = null
        }
    }
}
def hasKeystoreProps = keystoreFile != null

android {
    namespace = "com.polimelo.syncron.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.polimelo.syncroncap"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCode
        versionName appVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        manifestPlaceholders = [admobAppId: resolvedAdmobAppId]
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    if (hasKeystoreProps) {
        signingConfigs {
            release {
                storeFile keystoreFile
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (hasKeystoreProps) {
                signingConfig signingConfigs.release
            } else {
                logger.warn("[signing] DIKKAT: release build IMZASIZ kalacak. Neden: " + keystoreSkipReason)
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
