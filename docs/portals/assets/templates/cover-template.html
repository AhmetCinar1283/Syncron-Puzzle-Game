<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Syncron Master Cover (Retro Arcade 8-Bit - Minimal Text)</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", monospace, sans-serif;
      background: #050505;
      color: #f8fafc;
      user-select: none;
    }

    .cover-container {
      width: 1920px;
      height: 1080px;
      position: relative;
      overflow: hidden;
      background: radial-gradient(circle at 40% 50%, #111118 0%, #08080b 50%, #030304 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 120px;
      padding: 0 100px;
    }

    /* Ambient 8-Bit Pixel Grid */
    .ambient-grid {
      position: absolute;
      inset: 0;
      background-image: 
        linear-gradient(to right, rgba(250, 204, 21, 0.04) 2px, transparent 2px),
        linear-gradient(to bottom, rgba(250, 204, 21, 0.04) 2px, transparent 2px);
      background-size: 64px 64px;
      background-position: center center;
      pointer-events: none;
    }

    /* Retro CRT Scanlines */
    .scanlines {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to bottom,
        rgba(255, 255, 255, 0),
        rgba(255, 255, 255, 0) 50%,
        rgba(0, 0, 0, 0.35) 50%,
        rgba(0, 0, 0, 0.35)
      );
      background-size: 100% 6px;
      pointer-events: none;
      z-index: 6;
      opacity: 0.55;
    }

    /* Atmospheric Glow Spheres */
    .glow-emerald {
      position: absolute;
      top: 10%;
      left: 15%;
      width: 550px;
      height: 550px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(0, 255, 136, 0.12) 0%, transparent 70%);
      filter: blur(50px);
      pointer-events: none;
    }

    .glow-sky {
      position: absolute;
      bottom: 10%;
      right: 20%;
      width: 650px;
      height: 650px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(0, 196, 255, 0.12) 0%, transparent 70%);
      filter: blur(60px);
      pointer-events: none;
    }

    /* Central Safe Wrapper: 1440px width guarantees 0% clipping in all crops */
    .safe-content-wrapper {
      position: relative;
      z-index: 5;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 110px;
      width: 1440px;
    }

    /* LEFT: 5x5 Retro Arcade Game Board */
    .scene-wrapper {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .board-frame {
      position: relative;
      padding: 24px;
      background: #09090b;
      border: 4px solid #3f3f46;
      box-shadow: 
        0 0 0 3px #000000,
        0 25px 60px rgba(0, 0, 0, 0.9),
        0 0 40px rgba(250, 204, 21, 0.2);
    }

    .board-grid {
      display: grid;
      grid-template-columns: repeat(5, 100px);
      grid-template-rows: repeat(5, 100px);
      gap: 12px;
      position: relative;
    }

    /* Cell Base */
    .cell {
      position: relative;
      width: 100px;
      height: 100px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-sizing: border-box;
    }

    /* 8-Bit Normal Cell */
    .cell-normal {
      background: #0d0f17;
      border: 2px solid #1f2438;
      box-shadow: inset 2px 2px 0 #18181b, inset -2px -2px 0 #000;
    }

    /* 8-Bit Obstacle Brick */
    .cell-obstacle {
      background: #18181b;
      border: 2px solid #52525b;
      box-shadow: inset 3px 3px 0 #71717a, inset -3px -3px 0 #09090b;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .obstacle-inner {
      width: 68px;
      height: 68px;
      background: #27272a;
      border: 2px solid #3f3f46;
      box-shadow: inset 2px 2px 0 #52525b, inset -2px -2px 0 #18181b;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .obstacle-dot {
      width: 20px;
      height: 20px;
      background: #18181b;
      box-shadow: inset 1px 1px 0 #000, 1px 1px 0 #52525b;
    }

    /* 8-Bit Ice Cell */
    .cell-ice {
      background: #0f172a;
      border: 2px solid #0284c7;
      box-shadow: inset 2px 2px 0 #38bdf8, inset -2px -2px 0 #000;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .ice-snowflake {
      font-size: 40px;
      color: #38bdf8;
      text-shadow: 0 0 12px rgba(56, 189, 248, 0.9);
      user-select: none;
    }

    /* 8-Bit Teleport Cell */
    .cell-teleport {
      background: #18181b;
      border: 2px solid #ec4899;
      box-shadow: inset 2px 2px 0 rgba(236, 72, 153, 0.6), inset -2px -2px 0 #000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .teleport-arrow {
      font-size: 22px;
      line-height: 1;
      color: #ec4899;
      text-shadow: 0 0 8px #ec4899;
      font-weight: 900;
    }
    .teleport-label {
      font-size: 16px;
      font-weight: 900;
      color: #ec4899;
      text-shadow: 0 0 6px #ec4899;
      margin-top: 2px;
    }

    /* 8-Bit Box Entity */
    .cell-box {
      width: 80px;
      height: 80px;
      background: #27272a;
      border: 2px solid #f97316;
      box-shadow: 
        inset 3px 3px 0 rgba(255, 255, 255, 0.4), 
        inset -3px -3px 0 #000000, 
        0 0 16px rgba(249, 115, 22, 0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    .box-symbol {
      font-size: 28px;
      color: #f97316;
      text-shadow: 0 0 10px rgba(249, 115, 22, 0.9);
      font-weight: bold;
    }
    .box-bolt {
      position: absolute;
      top: 3px;
      right: 4px;
      font-size: 14px;
      color: #fbbf24;
      text-shadow: 0 0 8px rgba(251, 191, 36, 0.9);
    }

    /* 8-Bit Arcade Player 1 (Emerald Robot) */
    .arcade-player-1 {
      width: 76px;
      height: 76px;
      background-color: #00ff88;
      box-shadow: 
        0 0 0 3px #000000, 
        inset 5px 5px 0 rgba(255, 255, 255, 0.9), 
        inset -5px -5px 0 rgba(0, 0, 0, 0.85),
        0 0 25px rgba(0, 255, 136, 0.7);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      z-index: 4;
    }
    .player-eyes {
      display: flex;
      gap: 10px;
      margin-bottom: 2px;
    }
    .player-eye {
      width: 8px;
      height: 8px;
      background: #000000;
    }
    .player-arrow {
      font-size: 24px;
      line-height: 1;
      color: #000000;
      font-weight: 900;
      font-family: 'Courier New', Courier, monospace;
    }

    /* 8-Bit Arcade Player 2 (Sky Blue Robot) */
    .arcade-player-2 {
      width: 76px;
      height: 76px;
      background-color: #00c4ff;
      box-shadow: 
        0 0 0 3px #000000, 
        inset 5px 5px 0 rgba(255, 255, 255, 0.9), 
        inset -5px -5px 0 rgba(0, 0, 0, 0.85),
        0 0 25px rgba(0, 196, 255, 0.7);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      z-index: 4;
    }

    /* 8-Bit Arcade Target 1 (Emerald) */
    .target-cell-p1 {
      background: rgba(0, 255, 136, 0.08);
      border: 3px solid #00ff88;
      box-shadow: inset 0 0 20px rgba(0, 255, 136, 0.3), 0 0 15px rgba(0, 255, 136, 0.25);
      position: relative;
    }
    .target-ring-p1 {
      position: absolute;
      inset: 8px;
      border: 2px dashed rgba(0, 255, 136, 0.6);
      pointer-events: none;
    }
    .target-symbol-p1 {
      font-size: 46px;
      color: #00ff88;
      text-shadow: 0 0 14px rgba(0, 255, 136, 0.9);
      font-weight: 900;
    }

    /* 8-Bit Arcade Target 2 (Sky Blue) */
    .target-cell-p2 {
      background: rgba(0, 196, 255, 0.08);
      border: 3px solid #00c4ff;
      box-shadow: inset 0 0 20px rgba(0, 196, 255, 0.3), 0 0 15px rgba(0, 196, 255, 0.25);
      position: relative;
    }
    .target-ring-p2 {
      position: absolute;
      inset: 8px;
      border: 2px dashed rgba(0, 196, 255, 0.6);
      pointer-events: none;
    }
    .target-symbol-p2 {
      font-size: 46px;
      color: #00c4ff;
      text-shadow: 0 0 14px rgba(0, 196, 255, 0.9);
      font-weight: 900;
    }

    /* Board Lasers Overlay */
    .board-overlays {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 3;
    }

    /* RIGHT: Minimalist, Bold Branding */
    .branding-wrapper {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: center;
      flex-shrink: 0;
    }

    /* Main Title - Minimal, High-Impact */
    .brand-title {
      font-size: 130px;
      font-weight: 900;
      letter-spacing: 18px;
      line-height: 1;
      text-transform: uppercase;
      background: linear-gradient(135deg, #00ff88 0%, #00c4ff 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 45px rgba(0, 196, 255, 0.9));
      margin-bottom: 24px;
    }

    /* Arcade Accent Line */
    .sync-accent-bar {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-top: 10px;
    }

    .accent-box-yellow {
      width: 16px;
      height: 16px;
      background: #facc15;
      box-shadow: 0 0 14px #facc15, 0 0 0 2px #000;
    }

    .accent-box-emerald {
      width: 16px;
      height: 16px;
      background: #00ff88;
      box-shadow: 0 0 14px #00ff88, 0 0 0 2px #000;
    }

    .accent-box-sky {
      width: 16px;
      height: 16px;
      background: #00c4ff;
      box-shadow: 0 0 14px #00c4ff, 0 0 0 2px #000;
    }

    .accent-line {
      width: 240px;
      height: 6px;
      background: linear-gradient(90deg, #facc15 0%, #00ff88 50%, #00c4ff 100%);
      box-shadow: 0 0 16px rgba(0, 196, 255, 0.8);
    }
  </style>
</head>
<body>
  <div class="cover-container">
    <div class="ambient-grid"></div>
    <div class="scanlines"></div>
    <div class="glow-emerald"></div>
    <div class="glow-sky"></div>

    <!-- Protected Central Safe Zone Container -->
    <div class="safe-content-wrapper">

      <!-- LEFT: 5x5 Game Board in Retro Arcade 8-Bit Mode -->
      <div class="scene-wrapper">
        <div class="board-frame">
          <div class="board-grid">
            
            <!-- Row 1 -->
            <!-- (0,0) Player 1 (8-Bit Emerald Robot) -->
            <div class="cell cell-normal">
              <div class="arcade-player-1">
                <div class="player-eyes">
                  <div class="player-eye"></div>
                  <div class="player-eye"></div>
                </div>
                <div class="player-arrow">▲</div>
              </div>
            </div>
            <!-- (0,1) Normal -->
            <div class="cell cell-normal"></div>
            <!-- (0,2) 8-Bit Obstacle Brick -->
            <div class="cell cell-obstacle">
              <div class="obstacle-inner">
                <div class="obstacle-dot"></div>
              </div>
            </div>
            <!-- (0,3) Normal -->
            <div class="cell cell-normal"></div>
            <!-- (0,4) Target P2 (8-Bit Sky) -->
            <div class="cell target-cell-p2">
              <div class="target-ring-p2"></div>
              <span class="target-symbol-p2">◎</span>
            </div>

            <!-- Row 2 -->
            <!-- (1,0) Normal -->
            <div class="cell cell-normal"></div>
            <!-- (1,1) 8-Bit Ice -->
            <div class="cell cell-ice">
              <span class="ice-snowflake">❄</span>
            </div>
            <!-- (1,2) Normal -->
            <div class="cell cell-normal"></div>
            <!-- (1,3) 8-Bit Powered Crate -->
            <div class="cell cell-normal">
              <div class="cell-box">
                <span class="box-symbol">▣</span>
                <span class="box-bolt">⚡</span>
              </div>
            </div>
            <!-- (1,4) Normal -->
            <div class="cell cell-normal"></div>

            <!-- Row 3 -->
            <!-- (2,0) Normal -->
            <div class="cell cell-normal"></div>
            <!-- (2,1) 8-Bit Obstacle Brick -->
            <div class="cell cell-obstacle">
              <div class="obstacle-inner">
                <div class="obstacle-dot"></div>
              </div>
            </div>
            <!-- (2,2) 8-Bit Teleport Portal A -->
            <div class="cell cell-teleport">
              <span class="teleport-arrow">⟿</span>
              <span class="teleport-label">A</span>
            </div>
            <!-- (2,3) 8-Bit Obstacle Brick -->
            <div class="cell cell-obstacle">
              <div class="obstacle-inner">
                <div class="obstacle-dot"></div>
              </div>
            </div>
            <!-- (2,4) Normal -->
            <div class="cell cell-normal"></div>

            <!-- Row 4 -->
            <!-- (3,0) Normal -->
            <div class="cell cell-normal"></div>
            <!-- (3,1) 8-Bit Ice -->
            <div class="cell cell-ice">
              <span class="ice-snowflake">❄</span>
            </div>
            <!-- (3,2) Normal -->
            <div class="cell cell-normal"></div>
            <!-- (3,3) Normal -->
            <div class="cell cell-normal"></div>
            <!-- (3,4) Player 2 (8-Bit Sky Robot) -->
            <div class="cell cell-normal">
              <div class="arcade-player-2">
                <div class="player-eyes">
                  <div class="player-eye"></div>
                  <div class="player-eye"></div>
                </div>
                <div class="player-arrow">▲</div>
              </div>
            </div>

            <!-- Row 5 -->
            <!-- (4,0) Target P1 (8-Bit Emerald) -->
            <div class="cell target-cell-p1">
              <div class="target-ring-p1"></div>
              <span class="target-symbol-p1">◎</span>
            </div>
            <!-- (4,1) Normal -->
            <div class="cell cell-normal"></div>
            <!-- (4,2) 8-Bit Obstacle Brick -->
            <div class="cell cell-obstacle">
              <div class="obstacle-inner">
                <div class="obstacle-dot"></div>
              </div>
            </div>
            <!-- (4,3) Normal -->
            <div class="cell cell-normal"></div>
            <!-- (4,4) Normal -->
            <div class="cell cell-normal"></div>

          </div>

          <!-- Trail Laser Lines Overlay -->
          <svg class="board-overlays" viewBox="0 0 548 548" fill="none">
            <defs>
              <filter id="p1-trail-glow" x="-20%" y="-20%" width="140%" height="140%">
                <feGaussianBlur stdDeviation="5" result="blur" />
                <feMerge>
                  <feMergeNode in="blur" />
                  <feMergeNode in="SourceGraphic" />
                </feMerge>
              </filter>
              <filter id="p2-trail-glow" x="-20%" y="-20%" width="140%" height="140%">
                <feGaussianBlur stdDeviation="5" result="blur" />
                <feMerge>
                  <feMergeNode in="blur" />
                  <feMergeNode in="SourceGraphic" />
                </feMerge>
              </filter>
            </defs>
            <!-- Trail P1 -->
            <path d="M 50 50 L 50 498" stroke="#00ff88" stroke-width="6" stroke-dasharray="12 10" opacity="0.85" filter="url(#p1-trail-glow)" />
            <!-- Trail P2 -->
            <path d="M 498 386 L 498 50" stroke="#00c4ff" stroke-width="6" stroke-dasharray="12 10" opacity="0.85" filter="url(#p2-trail-glow)" />
          </svg>
        </div>
      </div>

      <!-- RIGHT: Minimalist Bold Title (Only 1 word: "SYNCRON") -->
      <div class="branding-wrapper">
        <h1 class="brand-title">SYNCRON</h1>
        
        <div class="sync-accent-bar">
          <div class="accent-box-yellow"></div>
          <div class="accent-box-emerald"></div>
          <div class="accent-line"></div>
          <div class="accent-box-sky"></div>
        </div>
      </div>

    </div>

  </div>
</body>
</html>
