<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Syncron Master Icon (Retro Arcade 8-Bit, yalnızca maskotlar; ?transparent ile şeffaf)</title>
  <link rel="stylesheet" href="brand.css">
  <style>
    .stage { width: 1024px; height: 1024px; }
  </style>
  <script>if (location.search.includes('transparent')) document.documentElement.classList.add('transparent');</script>
</head>
<body>
  <div class="stage">
    <div class="fx-bg bg-grid"></div>
    <div class="fx-bg scanlines"></div>
    <div class="glow glow-g" style="left:60px;top:80px;width:520px;height:520px"></div>
    <div class="glow glow-b" style="right:40px;bottom:60px;width:520px;height:520px"></div>
    <div class="slot" style="left:155px;top:215px;width:400px;height:400px"><canvas data-mascot data-player="0" data-emote="happy" data-ms="250" data-size="400"></canvas></div>
    <div class="slot" style="left:525px;top:495px;width:320px;height:320px"><canvas data-mascot data-player="1" data-emote="wink" data-ms="300" data-size="320"></canvas></div>
    <div class="plus" style="--s:10px;--c:#facc15;left:700px;top:190px"></div>
    <div class="px" style="--s:18px;--c:#00c4ff;left:790px;top:330px"></div>
    <div class="px" style="--s:14px;--c:#facc15;left:130px;top:700px"></div>
    <div class="plus" style="--s:8px;--c:#00ff88;left:250px;top:810px"></div>
    <div class="px" style="--s:12px;--c:#00ff88;left:640px;top:880px"></div>
    <div class="px" style="--s:10px;--c:#00c4ff;left:120px;top:150px"></div>
  </div>
<script src="mascot.bundle.js"></script>
</body>
</html>
