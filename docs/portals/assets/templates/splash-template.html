<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Syncron Master Splash (Retro Arcade 8-Bit)</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', monospace, sans-serif;
      background: #050505;
      user-select: none;
    }

    .splash-container {
      width: 1080px;
      height: 1920px;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 50% 48%, #111116 0%, #070709 55%, #030304 100%);
    }

    /* Ambient 8-Bit Pixel Grid */
    .bg-grid {
      position: absolute;
      inset: 0;
      background-image: 
        linear-gradient(to right, rgba(250, 204, 21, 0.04) 2px, transparent 2px),
        linear-gradient(to bottom, rgba(250, 204, 21, 0.04) 2px, transparent 2px);
      background-size: 48px 48px;
      background-position: center center;
    }

    /* Retro CRT Scanline Texture */
    .scanlines {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to bottom,
        rgba(255, 255, 255, 0),
        rgba(255, 255, 255, 0) 50%,
        rgba(0, 0, 0, 0.35) 50%,
        rgba(0, 0, 0, 0.35)
      );
      background-size: 100% 6px;
      pointer-events: none;
      z-index: 7;
      opacity: 0.6;
    }

    /* Atmospheric Glows */
    .glow-emerald {
      position: absolute;
      top: 35%;
      left: 20%;
      width: 500px;
      height: 500px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(0, 255, 136, 0.12) 0%, transparent 70%);
      filter: blur(50px);
      pointer-events: none;
    }

    .glow-sky {
      position: absolute;
      top: 35%;
      right: 20%;
      width: 500px;
      height: 500px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(0, 196, 255, 0.12) 0%, transparent 70%);
      filter: blur(50px);
      pointer-events: none;
    }

    /* Hero Composition Stage */
    .hero-stage {
      position: relative;
      z-index: 5;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 60px;
    }

    /* Characters & Core Wrapper */
    .duo-wrapper {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 50px;
      position: relative;
    }

    /* Connecting Laser Path */
    .laser-svg {
      position: absolute;
      width: 440px;
      height: 100px;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 1;
      pointer-events: none;
    }

    /* Maskot: jeton, yüz ve süs oyundaki çizici ile (mascot.bundle.js) çizilir */
    .mascot-slot { width: 200px; height: 200px; position: relative; z-index: 4; }
    .mascot-slot canvas { display: block; }

    /* Center 8-Bit Sync Core */
    .center-sync-badge {
      width: 84px;
      height: 84px;
      background: #09090b;
      border: 5px solid #facc15;
      box-shadow: 
        0 0 0 4px #000000,
        0 0 35px rgba(250, 204, 21, 0.8), 
        inset 4px 4px 0 rgba(255, 255, 255, 0.6),
        inset -4px -4px 0 #000000;
      z-index: 6;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .center-sync-icon {
      width: 44px;
      height: 44px;
    }

    /* Minimalist Branding - STRICTLY JUST SYNCRON */
    .branding-block {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin-top: 20px;
    }

    .splash-title {
      font-size: 92px;
      font-weight: 900;
      letter-spacing: 16px;
      line-height: 1;
      text-transform: uppercase;
      background: linear-gradient(135deg, #00ff88 0%, #00c4ff 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 35px rgba(0, 196, 255, 0.9));
    }

    /* Retro Pixel Dots Accent */
    .dots-accent {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-top: 36px;
    }

    .accent-box {
      width: 14px;
      height: 14px;
      box-shadow: 0 0 0 2px #000;
    }
    .box-yellow {
      background: #facc15;
      box-shadow: 0 0 12px #facc15, 0 0 0 2px #000;
    }
    .box-emerald {
      background: #00ff88;
      box-shadow: 0 0 12px #00ff88, 0 0 0 2px #000;
    }
    .box-sky {
      background: #00c4ff;
      box-shadow: 0 0 12px #00c4ff, 0 0 0 2px #000;
    }
    .accent-bar {
      width: 160px;
      height: 4px;
      background: linear-gradient(90deg, #facc15 0%, #00ff88 50%, #00c4ff 100%);
      box-shadow: 0 0 14px rgba(0, 196, 255, 0.8);
    }
  </style>
</head>
<body>
  <div class="splash-container">
    <div class="bg-grid"></div>
    <div class="scanlines"></div>
    <div class="glow-emerald"></div>
    <div class="glow-sky"></div>

    <div class="hero-stage">
      <!-- Characters Duo + Sync Core -->
      <div class="duo-wrapper">
        
        <!-- P1: Emerald Robot -->
        <div class="mascot-slot"><canvas data-mascot data-player="0" data-emote="happy" data-ms="250" data-size="200"></canvas></div>

        <!-- Laser Line -->
        <svg class="laser-svg" viewBox="0 0 440 100" fill="none">
          <defs>
            <filter id="splash-laser-glow" x="-20%" y="-20%" width="140%" height="140%">
              <feGaussianBlur stdDeviation="5" result="blur" />
              <feMerge>
                <feMergeNode in="blur" />
                <feMergeNode in="SourceGraphic" />
              </feMerge>
            </filter>
          </defs>
          <line x1="20" y1="50" x2="420" y2="50" stroke="#facc15" stroke-width="6" stroke-dasharray="12 8" opacity="0.85" filter="url(#splash-laser-glow)" />
        </svg>

        <!-- Central Sync Core -->
        <div class="center-sync-badge">
          <svg class="center-sync-icon" viewBox="0 0 24 24" fill="none">
            <path d="M7 16V4m0 0L3 8m4-4l4 4m6-4v12m0 0l4-4m-4 4l-4-4" stroke="#facc15" stroke-width="2.8" stroke-linecap="square" stroke-linejoin="miter" />
          </svg>
        </div>

        <!-- P2: Sky Blue Robot -->
        <div class="mascot-slot"><canvas data-mascot data-player="1" data-emote="wink" data-ms="300" data-size="200"></canvas></div>

      </div>

      <!-- Minimalist Branding - Strictly 'SYNCRON' -->
      <div class="branding-block">
        <div class="splash-title">SYNCRON</div>
        <div class="dots-accent">
          <div class="accent-box box-yellow"></div>
          <div class="accent-box box-emerald"></div>
          <div class="accent-bar"></div>
          <div class="accent-box box-sky"></div>
        </div>
      </div>

    </div>

  </div>
<script src="mascot.bundle.js"></script>
</body>
</html>
