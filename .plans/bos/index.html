<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Haftalık Ders + Çalışma Programı</title>
<!-- Kristal netlikte PNG çıktısı için html2canvas kütüphanesi -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  :root {
    --bg-main: #0c1017;
    --border-grid: #1c212b;
    --border-slot: #161b24;
    --text-main: #e6edf3;
    --text-muted: #7d8590;
    --px-per-min: 1.15px; /* 1 saat = 69px */
    --start-hour: 8;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { background: var(--bg-main); color: var(--text-main); padding: 18px; overflow-x: auto; }

  /* Üst Toolbar */
  .toolbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #161b22;
    padding: 10px 16px;
    border-radius: 8px;
    border: 1px solid var(--border-grid);
    margin-bottom: 14px;
    min-width: 1240px;
  }
  .tools-left { display: flex; gap: 8px; align-items: center; }
  .tools-right { font-size: 12px; color: var(--text-muted); }
  .btn {
    background: #21262d;
    color: var(--text-main);
    border: 1px solid #363b42;
    padding: 7px 13px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 12.5px;
    font-weight: 500;
    transition: background 0.15s, border-color 0.15s;
    display: inline-flex;
    align-items: center;
    gap: 5px;
  }
  .btn:hover { background: #30363d; border-color: #8b949e; }
  .btn-add { background: #238636; border-color: #2ea043; color: #fff; font-weight: 600; }
  .btn-add:hover { background: #2ea043; }
  .btn-export { background: #1f6feb; border-color: #388bfd; color: #fff; }
  .btn-export:hover { background: #388bfd; }

  /* Takvim Alanı */
  #captureArea {
    background: var(--bg-main);
    padding: 6px;
    border-radius: 10px;
    display: inline-block;
  }

  .calendar-board {
    display: flex;
    border: 1px solid var(--border-grid);
    border-radius: 8px;
    background: #0d1117;
    width: 1240px;
    overflow: hidden;
  }

  .time-gutter {
    width: 65px;
    flex-shrink: 0;
    border-right: 1px solid var(--border-grid);
    background: #0d1117;
  }

  .days-container {
    display: flex;
    flex-grow: 1;
  }

  .day-column {
    flex: 1;
    border-right: 1px solid var(--border-grid);
    position: relative;
    min-width: 165px;
  }
  .day-column:last-child { border-right: none; }

  .column-header {
    height: 48px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    border-bottom: 1px solid var(--border-grid);
    background: #11161d;
    font-size: 13.5px;
    font-weight: 600;
  }
  .column-header small {
    font-size: 11px;
    font-weight: 400;
    color: var(--text-muted);
    margin-top: 2px;
  }

  .grid-timeline {
    position: relative;
    height: 897px; /* 13 saat * 69px */
  }

  .hour-line {
    height: 69px;
    border-bottom: 1px solid var(--border-slot);
  }
  .time-label {
    height: 69px;
    border-bottom: 1px solid var(--border-slot);
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding-top: 4px;
    font-size: 11px;
    color: var(--text-muted);
    font-weight: 500;
  }

  /* Kart Yapısı */
  .event-card {
    position: absolute;
    left: 5px;
    right: 5px;
    border-radius: 8px;
    padding: 7px 9px;
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    cursor: grab;
    z-index: 5;
    overflow: hidden;
    box-shadow: 0 2px 6px rgba(0,0,0,0.4);
  }
  .event-card:active { cursor: grabbing; z-index: 50; box-shadow: 0 8px 22px rgba(0,0,0,0.6); }
  .event-card.dragging { opacity: 0.65; }

  .event-time {
    font-size: 10px;
    font-weight: 600;
    opacity: 0.9;
    margin-bottom: 2px;
    pointer-events: none;
  }
  .event-title {
    font-size: 12px;
    font-weight: 700;
    margin-bottom: 2px;
    line-height: 1.25;
    pointer-events: none;
    padding-right: 14px;
  }
  .event-sub {
    font-size: 10px;
    opacity: 0.85;
    line-height: 1.2;
    pointer-events: none;
  }

  /* Hızlı Sil Butonu */
  .btn-delete-quick {
    position: absolute;
    top: 3px;
    right: 5px;
    font-size: 14px;
    color: inherit;
    opacity: 0.35;
    cursor: pointer;
    line-height: 1;
    padding: 2px;
  }
  .btn-delete-quick:hover { opacity: 1; font-weight: bold; }

  /* Boyutlandırma Çubuğu */
  .resizer-handle {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 8px;
    cursor: s-resize;
    background: rgba(255,255,255,0.08);
    border-bottom-left-radius: 8px;
    border-bottom-right-radius: 8px;
  }
  .resizer-handle:hover { background: rgba(255,255,255,0.3); }

  .dashed-box { border: 1.5px dashed rgba(255,255,255,0.35); }

  /* Renkler */
  .col-cyan    { background: #56b6d3; color: #07222b; }
  .col-green   { background: #96be43; color: #172703; }
  .col-red     { background: #b03a35; color: #ffffff; }
  .col-orange  { background: #df7b35; color: #ffffff; }
  .col-navy    { background: #233454; color: #d0e1fd; }
  .col-purple  { background: #947ab4; color: #ffffff; }
  .col-gold    { background: #d49a37; color: #221401; }
  .col-teal    { background: #266b6c; color: #e6fcf8; }
  .col-gray    { background: #e3e7ee; color: #121820; }
  .col-ghost   { background: rgba(255,255,255,0.03); border: 1.5px dashed #30363d; color: var(--text-muted); }

  /* Modal */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.7);
    display: none; align-items: center; justify-content: center; z-index: 999;
  }
  .modal {
    background: #161b22; border: 1px solid var(--border-grid);
    border-radius: 10px; width: 340px; padding: 18px; display: flex; flex-direction: column; gap: 11px;
  }
  .modal h3 { font-size: 15px; }
  .modal input, .modal select {
    width: 100%; background: #0d1117; border: 1px solid #30363d;
    padding: 7px 10px; border-radius: 6px; color: var(--text-main); font-size: 13px;
  }
  .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 5px; }

  @media print {
    .toolbar, .btn-delete-quick, .resizer-handle { display: none !important; }
    body { background: #0d1117; padding: 0; }
  }
</style>
</head>
<body>

<div class="toolbar">
  <div class="tools-left">
    <button class="btn btn-add" onclick="openNewEventModal()">➕ Yeni Ders Ekle</button>
    <button class="btn btn-export" onclick="exportAsPNG()">🖼️ Resim İndir (PNG)</button>
    <button class="btn" onclick="window.print()">🖨️ PDF / Yazdır</button>
    <button class="btn" onclick="exportJSON()">💾 JSON Kaydet</button>
    <button class="btn" onclick="document.getElementById('importFile').click()">📂 JSON Yükle</button>
    <input type="file" id="importFile" style="display:none" onchange="importJSON(event)">
    <button class="btn" onclick="resetToDefault()">🔄 Sıfırla</button>
  </div>
  <div class="tools-right">
    💡 <b>Sürükle:</b> Taşı | <b>Alttan Çek:</b> Süre uzat/kısalt | <b>Çift Tık:</b> Düzenle | <b>×:</b> Sil
  </div>
</div>

<div id="captureArea">
  <div class="calendar-board">
    <div class="time-gutter">
      <div class="column-header">Saat</div>
      <div id="gutter-hours"></div>
    </div>
    <div class="days-container" id="days-wrapper"></div>
  </div>
</div>

<!-- Ekleme & Düzenleme Modalı -->
<div class="modal-overlay" id="editModal">
  <div class="modal">
    <h3 id="modalTitleText">Dersi Düzenle</h3>
    <input type="text" id="mTitle" placeholder="Ders Kodu / Başlık (Örn: COM1007)">
    <input type="text" id="mSub" placeholder="Açıklama / Alt Başlık (Örn: Computer Prog I)">
    
    <div style="display:flex; gap:6px;">
      <select id="mDay">
        <option value="Pzt">Pazartesi</option>
        <option value="Sal">Salı</option>
        <option value="Car">Çarşamba</option>
        <option value="Per">Perşembe</option>
        <option value="Cum">Cuma</option>
        <option value="Cmt">Cumartesi</option>
        <option value="Paz">Pazar</option>
      </select>
    </div>
    
    <div style="display:flex; gap:6px;">
      <input type="time" id="mStart" value="09:00">
      <input type="time" id="mEnd" value="10:00">
    </div>

    <select id="mColor">
      <option value="col-cyan">Açık Mavi (Dersler)</option>
      <option value="col-navy">Koyu Lacivert (Bireysel / Ödev)</option>
      <option value="col-green">Açık Yeşil</option>
      <option value="col-red">Kırmızı / Bordo (Fizik vb.)</option>
      <option value="col-orange">Turuncu (AI / Derin İş)</option>
      <option value="col-purple">Mor</option>
      <option value="col-gold">Hardal / Sarı</option>
      <option value="col-teal">Teal (Mavi-Yeşil)</option>
      <option value="col-gray">Gri</option>
      <option value="col-ghost">Şeffaf Çizgili (Tampon / Dinlenme)</option>
    </select>

    <label style="font-size:12px; display:flex; align-items:center; gap:6px; cursor:pointer;">
      <input type="checkbox" id="mDashed" style="width:auto;"> Kesikli Kenarlık (Bireysel Çalışma Stili)
    </label>

    <div class="modal-actions">
      <button class="btn" id="btnModalDelete" style="color:#f85149;" onclick="deleteActiveEvent()">Sil</button>
      <button class="btn" onclick="closeModal()">İptal</button>
      <button class="btn btn-export" onclick="saveModal()">Kaydet</button>
    </div>
  </div>
</div>

<script>
const START_HOUR = 8;
const TOTAL_HOURS = 13; // 08:00 - 21:00
const PX_PER_MIN = 1.15;
const SNAP_MINUTES = 15;

const DAYS = [
  { key: "Pzt", title: "Pazartesi", sub: "" },
  { key: "Sal", title: "Salı", sub: "" },
  { key: "Car", title: "Çarşamba", sub: "" },
  { key: "Per", title: "Perşembe", sub: "" },
  { key: "Cum", title: "Cuma", sub: "" },
  { key: "Cmt", title: "Cumartesi", sub: "çalışma" },
  { key: "Paz", title: "Pazar", sub: "tampon" }
];

const DEFAULT_EVENTS = [
  { id: 1, day: "Pzt", s: "09:30", e: "11:30", title: "COM1007", sub: "Computer Programming I", color: "col-cyan", dashed: false },
  { id: 2, day: "Pzt", s: "12:30", e: "13:30", title: "COM1007 tekrar/ödev", sub: "", color: "col-navy", dashed: true },
  { id: 3, day: "Pzt", s: "13:30", e: "17:30", title: "ENG101", sub: "Reading & Writing Skills", color: "col-green", dashed: false },
  { id: 4, day: "Pzt", s: "20:00", e: "21:00", title: "Calculus tekrarı", sub: "", color: "col-navy", dashed: true },

  { id: 5, day: "Sal", s: "08:00", e: "09:00", title: "OUL101", sub: "Orientation · sadece ilk hafta", color: "col-gray", dashed: false },
  { id: 6, day: "Sal", s: "09:00", e: "10:00", title: "Lineer Cebir", sub: "Hafta 1–3 · 3Blue1Brown", color: "col-orange", dashed: false },
  { id: 7, day: "Sal", s: "10:00", e: "11:30", title: "Calculus çalışması", sub: "Hafta 4'ten itibaren", color: "col-gray", dashed: false },
  { id: 8, day: "Sal", s: "12:00", e: "13:30", title: "TUR171", sub: "Turkish Language I", color: "col-purple", dashed: false },
  { id: 9, day: "Sal", s: "13:30", e: "15:00", title: "Physics çalışması", sub: "", color: "col-navy", dashed: true },
  { id: 10, day: "Sal", s: "15:30", e: "17:30", title: "PHY0151", sub: "Physics Laboratory I", color: "col-red", dashed: false },
  { id: 11, day: "Sal", s: "19:30", e: "20:30", title: "Lab raporu", sub: "Gereken haftalar", color: "col-navy", dashed: true },

  { id: 12, day: "Car", s: "09:30", e: "11:30", title: "COM1007", sub: "Computer Programming I", color: "col-cyan", dashed: false },
  { id: 13, day: "Car", s: "12:00", e: "15:00", title: "AI Hattı — derin iş", sub: "Bloğa göre içerik değişir", color: "col-orange", dashed: false },
  { id: 14, day: "Car", s: "15:30", e: "17:00", title: "COM1007 ödev / COM1015 okuma", sub: "", color: "col-navy", dashed: true },
  { id: 15, day: "Car", s: "18:00", e: "19:20", title: "HIS103", sub: "Atatürk İlkeleri I", color: "col-gold", dashed: false },

  { id: 16, day: "Per", s: "09:30", e: "11:30", title: "COM1007 Lab", sub: "Programming I — Lab", color: "col-cyan", dashed: false },
  { id: 17, day: "Per", s: "12:00", e: "14:00", title: "AI Hattı", sub: "Bloğa göre içerik değişir", color: "col-orange", dashed: false },
  { id: 18, day: "Per", s: "14:00", e: "15:00", title: "ENG101 ödev/okuma", sub: "", color: "col-green", dashed: true },
  { id: 19, day: "Per", s: "15:30", e: "18:30", title: "COM1015", sub: "Introduction to CS", color: "col-teal", dashed: false },

  { id: 20, day: "Cum", s: "09:30", e: "12:30", title: "PHY0105", sub: "Physics I", color: "col-red", dashed: false },
  { id: 21, day: "Cum", s: "13:30", e: "17:30", title: "MTH0143", sub: "Calculus I", color: "col-navy", dashed: false },
  { id: 22, day: "Cum", s: "18:30", e: "19:30", title: "Akşam kapalı — dinlen", sub: "", color: "col-ghost", dashed: false },

  { id: 23, day: "Cmt", s: "10:00", e: "12:00", title: "Calculus problem çözümü", sub: "", color: "col-navy", dashed: true },
  { id: 24, day: "Cmt", s: "12:00", e: "13:00", title: "Okuma + not", sub: "1 paper/blog", color: "col-orange", dashed: false },
  { id: 25, day: "Cmt", s: "14:00", e: "16:00", title: "Physics problem çözümü", sub: "", color: "col-navy", dashed: true },

  { id: 26, day: "Paz", s: "12:00", e: "12:45", title: "Haftalık değerlendirme", sub: "", color: "col-gray", dashed: true },
  { id: 27, day: "Paz", s: "15:30", e: "17:30", title: "Tampon / Serbest", sub: "opsiyonel: Polyvo/Senario (en fazla 2 sa)", color: "col-ghost", dashed: false }
];

let events = JSON.parse(localStorage.getItem("user_schedule")) || DEFAULT_EVENTS;
let activeEventId = null;

function timeToMin(timeStr) {
  const [h, m] = timeStr.split(":").map(Number);
  return (h - START_HOUR) * 60 + m;
}

function minToTime(totalMin) {
  const h = Math.floor(totalMin / 60) + START_HOUR;
  const m = totalMin % 60;
  return `${String(h).padStart(2, "0")}:${String(m).padStart(2, "0")}`;
}

function snap(min) {
  return Math.round(min / SNAP_MINUTES) * SNAP_MINUTES;
}

function saveLocal() {
  localStorage.setItem("user_schedule", JSON.stringify(events));
}

function render() {
  const gutter = document.getElementById("gutter-hours");
  gutter.innerHTML = "";
  for (let i = 0; i < TOTAL_HOURS; i++) {
    const div = document.createElement("div");
    div.className = "time-label";
    div.innerText = String(START_HOUR + i).padStart(2, "0") + ":00";
    gutter.appendChild(div);
  }

  const container = document.getElementById("days-wrapper");
  container.innerHTML = "";

  DAYS.forEach(day => {
    const col = document.createElement("div");
    col.className = "day-column";
    col.dataset.day = day.key;
    col.innerHTML = `<div class="column-header">${day.title} ${day.sub ? `<small>${day.sub}</small>` : ''}</div>`;

    const timeline = document.createElement("div");
    timeline.className = "grid-timeline";
    for (let i = 0; i < TOTAL_HOURS; i++) {
      const slot = document.createElement("div");
      slot.className = "hour-line";
      timeline.appendChild(slot);
    }

    events.filter(e => e.day === day.key).forEach(ev => {
      const top = timeToMin(ev.s) * PX_PER_MIN;
      const height = (timeToMin(ev.e) - timeToMin(ev.s)) * PX_PER_MIN;

      const card = document.createElement("div");
      card.className = `event-card ${ev.color} ${ev.dashed ? 'dashed-box' : ''}`;
      card.style.top = `${top}px`;
      card.style.height = `${height}px`;
      card.dataset.id = ev.id;

      card.innerHTML = `
        <span class="btn-delete-quick" title="Hızlı Sil" onclick="quickDelete(${ev.id}, event)">×</span>
        <div class="event-time">${ev.s}–${ev.e}</div>
        <div class="event-title">${ev.title}</div>
        ${ev.sub ? `<div class="event-sub">${ev.sub}</div>` : ''}
        <div class="resizer-handle"></div>
      `;

      bindCardEvents(card, ev);
      timeline.appendChild(card);
    });

    col.appendChild(timeline);
    container.appendChild(col);
  });
}

function bindCardEvents(card, ev) {
  card.addEventListener("dblclick", (e) => {
    e.stopPropagation();
    openEditModal(ev.id);
  });

  // Sürükle & Bırak
  card.addEventListener("mousedown", (e) => {
    if (e.target.classList.contains("resizer-handle") || e.target.classList.contains("btn-delete-quick")) return;
    e.preventDefault();

    card.classList.add("dragging");
    const startY = e.clientY;
    const initialTop = parseFloat(card.style.top);
    const durationMin = timeToMin(ev.e) - timeToMin(ev.s);

    function onMouseMove(moveEvent) {
      const deltaY = moveEvent.clientY - startY;
      let newTop = initialTop + deltaY;
      let currentMin = snap(newTop / PX_PER_MIN);

      if (currentMin < 0) currentMin = 0;
      if (currentMin + durationMin > TOTAL_HOURS * 60) currentMin = TOTAL_HOURS * 60 - durationMin;

      card.style.top = `${currentMin * PX_PER_MIN}px`;
      card.querySelector(".event-time").innerText = `${minToTime(currentMin)}–${minToTime(currentMin + durationMin)}`;

      const cols = document.querySelectorAll(".day-column");
      cols.forEach(col => {
        const rect = col.getBoundingClientRect();
        if (moveEvent.clientX >= rect.left && moveEvent.clientX <= rect.right) {
          ev.day = col.dataset.day;
        }
      });
    }

    function onMouseUp() {
      document.removeEventListener("mousemove", onMouseMove);
      document.removeEventListener("mouseup", onMouseUp);
      card.classList.remove("dragging");

      const finalTopMin = snap(parseFloat(card.style.top) / PX_PER_MIN);
      ev.s = minToTime(finalTopMin);
      ev.e = minToTime(finalTopMin + durationMin);

      saveLocal();
      render();
    }

    document.addEventListener("mousemove", onMouseMove);
    document.addEventListener("mouseup", onMouseUp);
  });

  // Boyutlandır
  const resizer = card.querySelector(".resizer-handle");
  resizer.addEventListener("mousedown", (e) => {
    e.stopPropagation();
    e.preventDefault();

    const startY = e.clientY;
    const initialHeight = parseFloat(card.style.height);
    const startMin = timeToMin(ev.s);

    function onResizeMove(moveEvent) {
      const deltaY = moveEvent.clientY - startY;
      let newH = initialHeight + deltaY;
      let newDuration = snap(newH / PX_PER_MIN);

      if (newDuration < 15) newDuration = 15;
      if (startMin + newDuration > TOTAL_HOURS * 60) newDuration = TOTAL_HOURS * 60 - startMin;

      card.style.height = `${newDuration * PX_PER_MIN}px`;
      card.querySelector(".event-time").innerText = `${ev.s}–${minToTime(startMin + newDuration)}`;
    }

    function onResizeUp() {
      document.removeEventListener("mousemove", onResizeMove);
      document.removeEventListener("mouseup", onResizeUp);

      const finalDuration = snap(parseFloat(card.style.height) / PX_PER_MIN);
      ev.e = minToTime(startMin + finalDuration);

      saveLocal();
      render();
    }

    document.addEventListener("mousemove", onResizeMove);
    document.addEventListener("mouseup", onResizeUp);
  });
}

/* Modal Kontrolleri */
function openNewEventModal() {
  activeEventId = null;
  document.getElementById("modalTitleText").innerText = "➕ Yeni Ders Ekle";
  document.getElementById("mTitle").value = "";
  document.getElementById("mSub").value = "";
  document.getElementById("mDay").value = "Pzt";
  document.getElementById("mStart").value = "10:00";
  document.getElementById("mEnd").value = "11:30";
  document.getElementById("mColor").value = "col-cyan";
  document.getElementById("mDashed").checked = false;
  document.getElementById("btnModalDelete").style.display = "none";

  document.getElementById("editModal").style.display = "flex";
}

function openEditModal(id) {
  activeEventId = id;
  const ev = events.find(x => x.id === id);
  if (!ev) return;

  document.getElementById("modalTitleText").innerText = "Dersi Düzenle";
  document.getElementById("mTitle").value = ev.title;
  document.getElementById("mSub").value = ev.sub || "";
  document.getElementById("mDay").value = ev.day;
  document.getElementById("mStart").value = ev.s;
  document.getElementById("mEnd").value = ev.e;
  document.getElementById("mColor").value = ev.color;
  document.getElementById("mDashed").checked = !!ev.dashed;
  document.getElementById("btnModalDelete").style.display = "inline-block";

  document.getElementById("editModal").style.display = "flex";
}

function closeModal() {
  document.getElementById("editModal").style.display = "none";
  activeEventId = null;
}

function saveModal() {
  const title = document.getElementById("mTitle").value.trim();
  if (!title) {
    alert("Lütfen en azından bir ders/iş başlığı girin!");
    return;
  }

  const s = document.getElementById("mStart").value;
  const e = document.getElementById("mEnd").value;
  if (timeToMin(s) >= timeToMin(e)) {
    alert("Bitiş saati başlangıç saatinden sonra olmalıdır!");
    return;
  }

  if (activeEventId) {
    // Düzenleme
    const ev = events.find(x => x.id === activeEventId);
    if (ev) {
      ev.title = title;
      ev.sub = document.getElementById("mSub").value.trim();
      ev.day = document.getElementById("mDay").value;
      ev.s = s;
      ev.e = e;
      ev.color = document.getElementById("mColor").value;
      ev.dashed = document.getElementById("mDashed").checked;
    }
  } else {
    // Yeni Ekleme
    const newId = events.length > 0 ? Math.max(...events.map(x => x.id)) + 1 : 1;
    events.push({
      id: newId,
      title: title,
      sub: document.getElementById("mSub").value.trim(),
      day: document.getElementById("mDay").value,
      s: s,
      e: e,
      color: document.getElementById("mColor").value,
      dashed: document.getElementById("mDashed").checked
    });
  }

  saveLocal();
  render();
  closeModal();
}

function quickDelete(id, e) {
  e.stopPropagation();
  if (confirm("Bu dersi silmek istediğine emin misin?")) {
    events = events.filter(x => x.id !== id);
    saveLocal();
    render();
  }
}

function deleteActiveEvent() {
  if (confirm("Bu dersi silmek istediğine emin misin?")) {
    events = events.filter(x => x.id !== activeEventId);
    saveLocal();
    render();
    closeModal();
  }
}

/* Yüksek Çözünürlüklü PNG Çıktısı */
function exportAsPNG() {
  const target = document.getElementById("captureArea");
  
  // Silme ikonlarını çıktı anında gizleyelim
  const delButtons = document.querySelectorAll(".btn-delete-quick, .resizer-handle");
  delButtons.forEach(b => b.style.visibility = "hidden");

  html2canvas(target, {
    backgroundColor: "#0c1017",
    scale: 2, // 2x Retina kalitesi (telefonda tam netlik sağlar)
    useCORS: true
  }).then(canvas => {
    delButtons.forEach(b => b.style.visibility = "visible");
    const link = document.createElement("a");
    link.download = "haftalik-ders-programi.png";
    link.href = canvas.toDataURL("image/png");
    link.click();
  }).catch(err => {
    delButtons.forEach(b => b.style.visibility = "visible");
    alert("Resim oluşturulurken hata oluştu: " + err);
  });
}

/* JSON İçe / Dışa Aktarma */
function exportJSON() {
  const blob = new Blob([JSON.stringify(events, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "ders-programi.json";
  a.click();
}

function importJSON(evt) {
  const file = evt.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      events = JSON.parse(e.target.result);
      saveLocal();
      render();
    } catch(err) {
      alert("Geçersiz JSON dosyası!");
    }
  };
  reader.readAsText(file);
}

function resetToDefault() {
  if (confirm("İlk orijinal programa geri dönmek istiyor musunuz?")) {
    events = JSON.parse(JSON.stringify(DEFAULT_EVENTS));
    saveLocal();
    render();
  }
}

render();
</script>
